name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: restaurant-react/package-lock.json

      - name: Install dependencies
        working-directory: restaurant-react
        run: npm ci

      - name: Build
        working-directory: restaurant-react
        env:
          VITE_SUPABASE_URL: https://dskskbogxpsjldqwevef.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRza3NrYm9neHBzamxkcXdldmVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1OTY0NDAsImV4cCI6MjA4MTE3MjQ0MH0.lRYUYb2tg3CuxkVSoNOVHmUqwcrS6WTdz3fV5Uk4kTw
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: restaurant-react/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
