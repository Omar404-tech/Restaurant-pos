{% extends 'base.html' %}

{% block title %}تغيير كلمة المرور - Restaurant System{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-key me-2"></i> تغيير كلمة المرور</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور الحالية</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">كلمة المرور الجديدة</label>
                        <input type="password" name="new_password" class="form-control" required minlength="8">
                        <small class="text-muted">يجب أن تكون 8 أحرف على الأقل</small>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">تأكيد كلمة المرور الجديدة</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i> تغيير كلمة المرور
                        </button>
                        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i> إلغاء
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
