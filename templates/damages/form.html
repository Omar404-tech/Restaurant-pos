{% extends 'base.html' %}

{% block title %}تسجيل تالف - Restaurant System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-trash-alt me-2"></i>تسجيل تالف</h2>
    <a href="{% url 'damages:list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-right me-1"></i>رجوع
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">الصنف *</label>
                    <select name="item" class="form-select" required>
                        <option value="">اختر الصنف</option>
                        {% for item in items %}
                        <option value="{{ item.pk }}">{{ item.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">الكمية *</label>
                    <input type="number" name="quantity" class="form-control" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">تكلفة الوحدة</label>
                    <input type="number" name="unit_cost" class="form-control" step="0.01" value="0">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">السبب</label>
                    <select name="reason" class="form-select">
                        <option value="">اختر السبب</option>
                        {% for r in reasons %}
                        <option value="{{ r.pk }}">{{ r.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">الوصف</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>تسجيل التالف
            </button>
        </form>
    </div>
</div>
{% endblock %}
