{% extends 'base.html' %}

{% block title %}تسجيل جرد جديد{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-clipboard-list me-2"></i>تسجيل جرد جديد</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">الفرع <span class="text-danger">*</span></label>
                            <select name="branch" class="form-select" required>
                                <option value="">اختر الفرع</option>
                                {% for branch in branches %}
                                <option value="{{ branch.pk }}">{{ branch.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">نوع الجرد <span class="text-danger">*</span></label>
                            <select name="count_type" class="form-select" required>
                                <option value="morning">جرد أول اليوم (صباحي)</option>
                                <option value="evening">جرد آخر اليوم (مسائي)</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">التاريخ</label>
                            <input type="date" name="count_date" class="form-control" value="{{ today }}">
                            <small class="text-muted">اتركه فارغاً لاستخدام تاريخ اليوم</small>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>ملاحظة:</strong> بعد إنشاء الجرد، ستتمكن من إضافة الأصناف والكميات الفعلية.
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>إنشاء الجرد
                            </button>
                            <a href="{% url 'inventory:consumption_dashboard' %}" class="btn btn-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
