{% extends 'base.html' %}

{% block title %}جرد جديد - Restaurant System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-clipboard-list me-2"></i>جرد جديد</h2>
    <a href="{% url 'inventory:daily_count_list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-right me-1"></i>رجوع
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">نوع الجرد</label>
                    <select name="count_type" class="form-select">
                        <option value="morning">صباحي</option>
                        <option value="evening">مسائي</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>بدء الجرد
            </button>
        </form>
    </div>
</div>
{% endblock %}
