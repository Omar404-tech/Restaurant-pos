{% extends 'base.html' %}

{% block title %}مرتجع مورد جديد - Restaurant System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-undo me-2"></i>مرتجع مورد جديد</h2>
    <a href="{% url 'returns:supplier_list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-right me-1"></i>رجوع
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">المورد *</label>
                    <select name="supplier" class="form-select" required>
                        <option value="">اختر المورد</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">الصنف *</label>
                    <select name="item" class="form-select" required>
                        <option value="">اختر الصنف</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">الكمية *</label>
                    <input type="number" name="quantity" class="form-control" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">السبب</label>
                    <select name="reason" class="form-select">
                        <option value="defective">معيب</option>
                        <option value="expired">منتهي الصلاحية</option>
                        <option value="wrong_item">صنف خاطئ</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>إنشاء المرتجع
            </button>
        </form>
    </div>
</div>
{% endblock %}
