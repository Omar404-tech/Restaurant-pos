{% extends 'base.html' %}

{% block title %}{% if edit %}تعديل{% else %}إضافة{% endif %} مورد - Restaurant System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-truck me-2"></i>{% if edit %}تعديل{% else %}إضافة{% endif %} مورد</h2>
    <a href="{% url 'suppliers:list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-right me-1"></i>رجوع
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">الكود *</label>
                    <input type="text" name="code" class="form-control" value="{{ supplier.code|default:'' }}" {% if edit %}readonly{% else %}required{% endif %}>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">الاسم *</label>
                    <input type="text" name="name" class="form-control" value="{{ supplier.name|default:'' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">الهاتف</label>
                    <input type="text" name="phone" class="form-control" value="{{ supplier.phone|default:'' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">جهة الاتصال</label>
                    <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person|default:'' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">العنوان</label>
                    <input type="text" name="address" class="form-control" value="{{ supplier.address|default:'' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">طريقة الدفع</label>
                    <select name="payment_method" class="form-select">
                        <option value="cash" {% if supplier.payment_method == 'cash' %}selected{% endif %}>نقدي</option>
                        <option value="credit" {% if supplier.payment_method == 'credit' %}selected{% endif %}>آجل</option>
                    </select>
                </div>
                {% if edit %}
                <div class="col-md-6 mb-3">
                    <label class="form-label">الحالة</label>
                    <select name="status" class="form-select">
                        <option value="active" {% if supplier.status == 'active' %}selected{% endif %}>نشط</option>
                        <option value="inactive" {% if supplier.status == 'inactive' %}selected{% endif %}>غير نشط</option>
                    </select>
                </div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>{% if edit %}تحديث{% else %}حفظ{% endif %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
