{% extends 'base.html' %}

{% block title %}سداد جديد - Restaurant System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-money-bill me-2"></i>سداد جديد</h2>
    <a href="{% url 'suppliers:payment_list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-right me-1"></i>رجوع
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">المورد *</label>
                    <select name="supplier" class="form-select" required>
                        <option value="">اختر المورد</option>
                        {% for s in suppliers %}
                        <option value="{{ s.pk }}">{{ s.name }} (رصيد: {{ s.current_balance|floatformat:2 }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">المبلغ *</label>
                    <input type="number" name="amount" class="form-control" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">طريقة الدفع</label>
                    <select name="payment_method" class="form-select">
                        <option value="cash">نقدي</option>
                        <option value="transfer">تحويل بنكي</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">تاريخ السداد *</label>
                    <input type="date" name="payment_date" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>تسجيل السداد
            </button>
        </form>
    </div>
</div>
{% endblock %}
