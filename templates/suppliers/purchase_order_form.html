{% extends 'base.html' %}

{% block title %}أمر شراء جديد{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-plus me-2"></i>أمر شراء جديد</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">من طلب شراء (اختياري)</label>
                            <select name="request" class="form-select">
                                <option value="">بدون طلب شراء</option>
                                {% for req in approved_requests %}
                                <option value="{{ req.pk }}" {% if request.GET.request == req.pk|stringformat:"s" %}selected{% endif %}>
                                    {{ req.request_number }} - {{ req.branch.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">المورد <span class="text-danger">*</span></label>
                            <select name="supplier" class="form-select" required>
                                <option value="">اختر المورد</option>
                                {% for supplier in suppliers %}
                                <option value="{{ supplier.pk }}">{{ supplier.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">الفرع <span class="text-danger">*</span></label>
                            <select name="branch" class="form-select" required>
                                <option value="">اختر الفرع</option>
                                {% for branch in branches %}
                                <option value="{{ branch.pk }}">{{ branch.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">تاريخ التسليم المتوقع</label>
                            <input type="date" name="expected_delivery" class="form-control">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">ملاحظات</label>
                            <textarea name="notes" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>إنشاء الأمر
                            </button>
                            <a href="{% url 'suppliers:purchase_order_list' %}" class="btn btn-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
