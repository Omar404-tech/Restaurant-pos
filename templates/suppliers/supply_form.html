{% extends 'base.html' %}

{% block title %}توريد جديد - Restaurant System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-boxes me-2"></i>توريد جديد</h2>
    <a href="{% url 'suppliers:supply_list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-right me-1"></i>رجوع
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">المورد *</label>
                    <select name="supplier" class="form-select" required>
                        <option value="">اختر المورد</option>
                        {% for s in suppliers %}
                        <option value="{{ s.pk }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">الفرع *</label>
                    <select name="branch" class="form-select" required>
                        <option value="">اختر الفرع</option>
                        {% for b in branches %}
                        <option value="{{ b.pk }}">{{ b.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">رقم الفاتورة</label>
                    <input type="text" name="invoice_number" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">طريقة الدفع</label>
                    <select name="payment_method" class="form-select">
                        <option value="cash">نقدي</option>
                        <option value="credit">آجل</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>إنشاء التوريد
            </button>
        </form>
    </div>
</div>
{% endblock %}
