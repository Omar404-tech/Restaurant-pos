{% extends 'base.html' %}

{% block title %}تحويل جديد - Restaurant System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-exchange-alt me-2"></i>تحويل جديد</h2>
    <a href="{% url 'transfers:list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-right me-1"></i>رجوع
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">من فرع *</label>
                    <select name="from_branch" class="form-select" required>
                        <option value="">اختر الفرع</option>
                        {% for b in branches %}
                        <option value="{{ b.pk }}">{{ b.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">إلى فرع *</label>
                    <select name="to_branch" class="form-select" required>
                        <option value="">اختر الفرع</option>
                        {% for b in branches %}
                        <option value="{{ b.pk }}">{{ b.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i>إنشاء التحويل
            </button>
        </form>
    </div>
</div>
{% endblock %}
